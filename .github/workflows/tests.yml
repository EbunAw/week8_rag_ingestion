name: Week 11 Agent Tests

on:
  push:
    branches:
      - week11
  pull_request:
    branches:
      - week11

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn pydantic jinja2 httpx pytest
          python -m pip install opentelemetry-api opentelemetry-sdk opentelemetry-instrumentation-fastapi

      - name: Run evaluation tests
        run: python -m pytest -v evals.py
